services:
  - type: web
    name: preet-fantasy-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      # Required secret: durable PostgreSQL URL. Production startup rejects SQLite.
      - key: DATABASE_URL
        sync: false
