name: D11 automated tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
      - "integration/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d11-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Python 3.11 test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///./d11_ci_test.db
      ADMIN_TOKEN: ci-test-token
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run complete pytest suite
        env:
          PYTHONPATH: .
        run: python -m pytest -q

      - name: Upload test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: d11-ci-test-diagnostics
          path: |
            d11_ci_test.db
            .pytest_cache
          if-no-files-found: ignore
          retention-days: 3
