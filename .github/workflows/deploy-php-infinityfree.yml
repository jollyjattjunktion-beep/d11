name: Deploy D11 PHP to InfinityFree

on:
  push:
    branches:
      - php/cricket-importer
    paths:
      - "php-site/app/**"
      - "php-site/public/**"
      - ".github/workflows/deploy-php-infinityfree.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d11-php-infinityfree-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy PHP application files
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          ref: php/cricket-importer

      - name: Validate deployment secrets
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          test -n "$FTP_HOST" || { echo "::error::Add FTP_HOST in repository Actions secrets."; exit 1; }
          test -n "$FTP_USERNAME" || { echo "::error::Add FTP_USERNAME in repository Actions secrets."; exit 1; }
          test -n "$FTP_PASSWORD" || { echo "::error::Add FTP_PASSWORD in repository Actions secrets."; exit 1; }
          test -n "$FTP_SERVER_DIR" || { echo "::error::Add FTP_SERVER_DIR (usually /htdocs/) in repository Actions secrets."; exit 1; }

      - name: Install FTP client
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp

      - name: Deploy public web files and application code
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_ROOT="${FTP_SERVER_DIR%/}/"
          REMOTE_APP="${REMOTE_ROOT}app/"

          # Upload public/ contents into the existing web document root.
          # No --delete option is used: unrelated live files are never removed.
          # Keep the hosting's existing .htaccess and user uploads untouched.
          lftp -e "
            set ftp:passive-mode true;
            set net:max-retries 2;
            set net:timeout 25;
            open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_HOST\";
            mirror --reverse --verbose --overwrite --no-perms --parallel=2 --exclude-glob .htaccess --exclude-glob 'uploads/**' ./php-site/public/ \"$REMOTE_ROOT\";
            mirror --reverse --verbose --overwrite --no-perms --parallel=2 ./php-site/app/ \"$REMOTE_APP\";
            bye
          "

      - name: Deployment summary
        run: |
          echo "PHP application files uploaded to the configured hosting directory."
          echo "The workflow does not upload database/, migrations/, config/, storage/, or the Python application."
